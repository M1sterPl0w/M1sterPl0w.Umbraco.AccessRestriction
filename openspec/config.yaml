schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  Umbraco 18 / .NET 10 Razor Class Library on main; Umbraco 17 hotfixes live on the release/v17 branch (package major equals Umbraco major, no conditional compilation) shipped as a NuGet package; there is no host app in this repo.
  Package versions live only in Directory.Packages.props, never in csproj files.
  Schema changes require a new migration chained onto AccessRestrictionMigrationPlan; never edit existing migration steps.
  A new condition type touches four places: RuleEngine/Conditions/, AccessRuleEngine.CreateCondition, ValidConditionTypes in the API controller, and the dashboard UI.
  Client/src/api/*.gen.ts is generated by `npm run generate-client` against a running site; never hand-edit it.
  Every repository write must invalidate or refresh its IMemoryCache entry.
  Folder names and namespaces differ (Repository/* uses ...Services, Models/Dto|Settings/* uses ...Models); follow the folder's existing namespace.

rules:
  tasks:
    - Include xUnit tests (Moq, Helpers/TestHttpContextBuilder) for changed behavior; CI does not run dotnet test, so list `dotnet test` as an explicit task
    - Include `npm run build` in Client/ when the dashboard or generated API client changes
